        mkdir -p .simplia-ci/test-results && (cd tools/dev && pnpm exec node --import tsx --test --test-concurrency=2 --test-reporter=junit --test-reporter-destination=../../.simplia-ci/test-results/tools-dev.xml tests/*.test.ts)
