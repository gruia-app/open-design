# CI only. Native macOS/Windows packaging and signing remain separate release lanes.
app_key: open-design
repo: https://github.com/gruia-app/open-design.git
default_branch: main
stack:
  type: [node, next, monorepo]
paths:
  root: .
  frontend: apps/web
  backend: apps/daemon
commands:
  install:
    - id: node24-pnpm-toolchain
      # The shared image currently has Node 22 / pnpm 9. Install only in the
      # build-owned temp directory. Each command restores its PATH priority after
      # the shared library prepends system binaries at the shell boundary.
      run: |
        export PATH="$PNPM_HOME:$PATH"
        set -eu
        case "$(uname -m)" in
          x86_64) node_arch=x64 ;;
          aarch64|arm64) node_arch=arm64 ;;
          *) echo "Unsupported Node.js architecture" >&2; exit 1 ;;
        esac
        node_release=node-v24.19.0-linux-$node_arch
        toolchain_dir="$WORKSPACE@tmp/open-design-toolchain"
        mkdir -p "$toolchain_dir" "$PNPM_HOME"
        cd "$toolchain_dir"
        curl --fail --silent --show-error --location --retry 3 "https://nodejs.org/dist/v24.19.0/$node_release.tar.xz" -o "$node_release.tar.xz"
        curl --fail --silent --show-error --location --retry 3 https://nodejs.org/dist/v24.19.0/SHASUMS256.txt -o SHASUMS256.txt
        awk -v archive="$node_release.tar.xz" '$2 == archive { print }' SHASUMS256.txt > selected.sha256
        test "$(wc -l < selected.sha256)" -eq 1
        sha256sum --check selected.sha256
        tar -xJf "$node_release.tar.xz"
        ln -sfn "$toolchain_dir/$node_release/bin/node" "$PNPM_HOME/node"
        "$toolchain_dir/$node_release/bin/corepack" enable --install-directory "$PNPM_HOME"
        node --version
        test "$(node --version)" = v24.19.0
        cd "$WORKSPACE"
        test "$(pnpm --version)" = 10.33.2
    - id: frozen-workspace-install
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm install --frozen-lockfile
    - id: bootstrap-workspace-builds
      # Tests/typechecks need built workspace exports before the Build stage.
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm -r --workspace-concurrency=2 --filter '!@open-design/web' --if-present run build
    - id: bootstrap-web-sidecar
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm --filter @open-design/web build:sidecar
    - id: install-chromium
      # Worker must provide Playwright's OS libraries; no privileged apt install.
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm -C e2e exec playwright install chromium
  lint:
    - id: repository-guard
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm guard
    - id: i18n-consistency
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm i18n:check
    - id: craft-references
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm lint:craft
    - id: workflow-lint
      run: |
        export PATH="$PNPM_HOME:$PATH"
        actionlint -color
    - id: handoff-contract
      run: |
        export PATH="$PNPM_HOME:$PATH"
        python3 .github/scripts/handoff.py self-check
  typecheck:
    - id: workspace-typecheck
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm -r --workspace-concurrency=2 --if-present run typecheck
    - id: scripts-typecheck
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm exec tsc -p scripts/tsconfig.json --noEmit
  test:
    - id: test-closure
      run: >-
        export PATH="$PNPM_HOME:$PATH";
        pnpm --filter @open-design/closure test --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit="$WORKSPACE/.simplia-ci/test-results/closure.xml"
      reports:
        - type: junit
          path: .simplia-ci/test-results/closure.xml
          required: true
    - id: test-daemon
      run: >-
        export PATH="$PNPM_HOME:$PATH";
        pnpm --filter @open-design/daemon test --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit="$WORKSPACE/.simplia-ci/test-results/daemon.xml"
      reports:
