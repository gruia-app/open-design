  build:
    - id: web-production-build
      run: |
        export PATH="$PNPM_HOME:$PATH"
        pnpm --filter @open-design/web build
  e2e:
    - id: functional-browser-suite
      run: >-
        export PATH="$PNPM_HOME:$PATH";
        CI=1 OD_PLAYWRIGHT_WORKERS=2 OD_PLAYWRIGHT_FULLY_PARALLEL=1
        PLAYWRIGHT_JUNIT_OUTPUT_FILE="$WORKSPACE/.simplia-ci/test-results/browser-functional.xml"
        pnpm -C e2e exec playwright test -c playwright.config.ts --reporter=list,junit
      reports:
        - type: junit
          path: .simplia-ci/test-results/browser-functional.xml
          required: true
    - id: visual-browser-suite
      run: >-
        export PATH="$PNPM_HOME:$PATH";
        CI=1 OD_PLAYWRIGHT_WORKERS=2 OD_VISUAL_OUTPUT_DIR=ui/reports/visual-screenshots
        PLAYWRIGHT_JUNIT_OUTPUT_FILE="$WORKSPACE/.simplia-ci/test-results/browser-visual.xml"
        pnpm -C e2e exec playwright test -c playwright.visual.config.ts --reporter=list,junit
      reports:
        - type: junit
          path: .simplia-ci/test-results/browser-visual.xml
          required: true
deploy:
  type: none
health: {}
security:
  trivy: true
  severity: HIGH,CRITICAL
  fail_on_vulnerability: true
  cve_grace: false
ci:
  fast_pr:
    enabled: false
  path_filters: false
  parallel_checks: false
  parallel_test_lanes:
    enabled: false
  observability:
    enabled: true
  test_selection:
    mode: "off"
  cache:
    # Never restore install outputs produced under the image's Node 22 runtime.
    install_policy: disabled
    build_policy: disabled
  resources:
    enabled: true
    build_class: large
